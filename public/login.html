<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Controle de Devoluções</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-slate-100 dark:bg-darkBg text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white dark:bg-darkCard rounded-3xl max-w-sm w-full p-8 shadow-sm border border-slate-200 dark:border-darkBorder">
    <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xl font-bold mb-4">🔒</div>
    <h1 class="text-lg font-bold mb-1">Controle de Devoluções</h1>
    <p class="text-xs text-slate-500 mb-5">Digite a senha de acesso para continuar.</p>
    <form id="login-form">
      <input type="password" id="password" autocomplete="current-password" placeholder="Senha"
        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-sm mb-3 outline-none focus:ring-2 focus:ring-indigo-500">
      <p id="error-msg" class="text-xs text-red-500 mb-3 hidden"></p>
      <button type="submit" class="w-full py-3 rounded-xl text-sm font-bold bg-slate-900 dark:bg-slate-800 text-white hover:bg-slate-800 transition-colors">Entrar</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          errorMsg.textContent = data.error || 'Falha ao entrar.';
          errorMsg.classList.remove('hidden');
        }
      } catch {
        errorMsg.textContent = 'Erro de conexão. Tente novamente.';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
